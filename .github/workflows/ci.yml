name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running run on the same branch/PR when a new commit lands,
# so superseded runs don't keep burning minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and writes check results.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: narratiq
          POSTGRES_PASSWORD: narratiq
          # "narratiq_test" is deliberate, not arbitrary: it must match
          # backend/tests/db_safety_guard.py's allow-list, or the pytest
          # safety guard below refuses to run at all (see
          # docs/incidents/2026-09-22-database-row-count-discrepancy.md).
          POSTGRES_DB: narratiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://narratiq:narratiq@localhost:5432/narratiq_test
      SECRET_KEY: ci-only-placeholder-secret-key-not-used-for-anything-real-0000000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Enable pgvector extension
        run: PGPASSWORD=narratiq psql -h localhost -U narratiq -d narratiq_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Bootstrap base schema (create_all, matching start-narratiq.sh's real sequence)
        working-directory: backend
        run: |
          python3 - <<'PYEOF'
          import models
          from database import engine, Base, run_db_migrations
          Base.metadata.create_all(bind=engine)
          run_db_migrations(engine)
          print("[ci] base schema created")
          PYEOF

      - name: Alembic upgrade head
        working-directory: backend
        run: python3 -m alembic upgrade head

      - name: Alembic round-trip (head -> base -> head)
        working-directory: backend
        # Proves every migration's downgrade() actually works, not just its
        # upgrade() — see docs/NarratIQ_Master_Implementation_Checklist.md
        # Stage 6's migration-verification note. Safe here: this service
        # container is destroyed at the end of the job regardless.
        run: |
          python3 -m alembic downgrade base
          python3 -m alembic upgrade head

      - name: Backend test suite
        working-directory: backend
        timeout-minutes: 15
        # known_stage5_defect tests are deliberately excluded here — they are
        # currently-open, real defects (see test_known_stage5_defects.py's own
        # docstring), not something this required check should block merges on
        # while they're deferred. They stay runnable on demand:
        #   pytest tests/ -m known_stage5_defect -q
        run: pytest tests/ -q -m "not known_stage5_defect"

      - name: Dependency vulnerability scan (pip-audit)
        if: always()
        working-directory: backend
        run: pip-audit -r requirements.txt -r ../requirements.setup.txt -r ../requirements.vllm.txt --desc || true
        # Non-fatal in the main CI job by design — see .github/workflows/dependency-scan.yml
        # for the scheduled, gating scan with a defined severity threshold (task 6.7).

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (next lint)
        working-directory: frontend
        run: npx next lint

      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit specs (Playwright --project=unit)
        working-directory: frontend
        run: npx playwright test --project=unit

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-unit-report
          path: frontend/playwright-report/
          retention-days: 14
