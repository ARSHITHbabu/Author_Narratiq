name: Dependency vulnerability scan

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC — matches Dependabot's own cadence
  push:
    branches: [main]
    paths:
      - "backend/requirements*.txt"
      - "requirements.setup.txt"
      - "requirements.vllm.txt"
      - "frontend/package-lock.json"
  pull_request:
    paths:
      - "backend/requirements*.txt"
      - "requirements.setup.txt"
      - "requirements.vllm.txt"
      - "frontend/package-lock.json"
  workflow_dispatch: {}

concurrency:
  group: dep-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Scan backend + setup + vllm requirements, gate on CRITICAL/HIGH only
        # pip-audit's own JSON has no severity field (verified directly against this
        # project's real dependencies before writing this gate — see the script's own
        # docstring). The wrapper cross-references OSV.dev for a real severity rating.
        # Every finding — including MODERATE/LOW/UNKNOWN — is always printed, so nothing
        # is silently dropped; only CRITICAL/HIGH fails the job.
        run: |
          pip-audit -r backend/requirements.txt -r requirements.setup.txt -r requirements.vllm.txt \
            --format json | python3 backend/scripts/pip_audit_severity_gate.py

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (fails on high/critical only; moderate/low remain visible above)
        working-directory: frontend
        run: |
          npm audit --omit=dev || true    # always show the full report first
          npm audit --audit-level=high --omit=dev
